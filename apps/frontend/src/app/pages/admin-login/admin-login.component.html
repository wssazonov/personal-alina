<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <a class="login-card__back" href="/">← Вернуться на сайт</a>
        <p class="login-card__eyebrow">Управление контентом</p>
        <h1 id="login-title">Вход в админку</h1>
        <p class="login-card__intro">
            Авторизуйтесь, чтобы обновить блоки лендинга.
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <label>
                <span>Логин</span>
                <input
                    type="text"
                    formControlName="login"
                    autocomplete="username"
                />
                @if (form.controls.login.touched && form.controls.login.invalid) {
                    <small>Введите логин</small>
                }
            </label>

            <label>
                <span>Пароль</span>
                <input
                    type="password"
                    formControlName="password"
                    autocomplete="current-password"
                />
                @if (
                    form.controls.password.touched &&
                    form.controls.password.invalid
                ) {
                    <small>Введите пароль</small>
                }
            </label>

            @if (errorMessage()) {
                <p class="login-card__error" role="alert">
                    {{ errorMessage() }}
                </p>
            }

            <button type="submit" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'Входим…' : 'Войти' }}
            </button>
        </form>
    </section>
</main>
