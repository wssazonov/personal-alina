<div class="page-shell">
    <app-header />
    @if (isLoading()) {
        <div class="content-loading" role="status" aria-label="Загрузка контента">
            <span></span>
        </div>
    }
    <main>
        <app-hero />
        @if (hasContent()) {
            <app-about />
            <app-benefits />
            <app-directions />
            <app-format />
            <app-reviews />
        } @else {
            <section class="content-placeholder container" aria-live="polite">
                <div class="content-placeholder__card">
                    <span></span>
                </div>
            </section>
        }
        <app-contacts />
    </main>
    <app-footer />
</div>
