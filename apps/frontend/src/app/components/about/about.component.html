<section id="about" class="about container" appRevealOnScroll>
    <div class="about__card">
        <div class="about__media">
            <img
                src="assets/images/alina-about.jpg"
                alt="Алина"
                loading="lazy"
                decoding="async"
            />
        </div>
        <div class="about__content">
            <h2>{{ about().title }}</h2>
            @for (paragraph of paragraphs(); track paragraph) {
                <p>{{ paragraph }}</p>
            }
            <ul class="about__metrics">
                @for (item of about().facts; track item.id) {
                    <li>
                        <span class="about__metric-icon">
                            <app-icon [name]="item.icon" />
                        </span>
                        <div>
                            <strong>{{ item.title }}</strong>
                            <span>{{ item.subtitle }}</span>
                        </div>
                    </li>
                }
            </ul>
        </div>
    </div>
</section>
