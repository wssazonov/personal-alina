<section class="benefits container" appRevealOnScroll>
    <h2 class="section-title">Что дает подготовка со мной?</h2>
    <div class="benefits__grid">
        @for (item of items(); track item.id) {
            <article class="card card--hoverable">
                <span class="benefits__icon">{{ item.icon }}</span>
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
            </article>
        }
    </div>
</section>
