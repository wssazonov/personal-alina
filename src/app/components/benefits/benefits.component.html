<section class="benefits container" appRevealOnScroll>
    <h2 class="section-title">Что даёт подготовка со мной?</h2>
    <div class="benefits__grid">
        @for (item of items(); track item.id) {
            <article class="card card--hoverable benefits__item">
                <span class="benefits__icon" [class.benefits__icon--peach]="item.id % 2 === 0">
                    {{ item.icon }}
                </span>
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
            </article>
        }
    </div>
</section>
