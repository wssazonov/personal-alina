<section class="contacts container" appRevealOnScroll>
    <div class="contacts__card">
        <div class="contacts__icon-wrap">
            <img
                src="assets/images/brain-logo.png"
                alt="Логотип"
                class="contacts__icon"
            />
        </div>

        <div class="contacts__content">
            <h2>Готов(а) начать подготовку к ЕГЭ уже сейчас?</h2>
            <p>
                Напиши мне в Telegram — отвечу на все вопросы и подберём
                удобное время для старта!
            </p>
        </div>

        <div class="contacts__right">
            <a
                class="button button--primary"
                href="https://t.me/AlinaAkishina"
                target="_blank"
                rel="noopener noreferrer"
            >
                Написать в Telegram
                <app-icon name="send" />
            </a>
            <a
                class="button button--ghost"
                href="https://wa.me/79819505805"
                target="_blank"
                rel="noopener noreferrer"
            >
                Написать в WhatsApp
            </a>
            <a
                class="contacts__phone"
                href="tel:+79819505805"
                target="_blank"
                rel="noopener noreferrer"
            >
                Позвонить
            </a>
        </div>

        <div class="contacts__links" aria-label="Контакты Алины">
            @for (link of links(); track link.id) {
                <a
                    class="contacts__link"
                    [href]="link.url"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>{{ link.title }}</span>
                    <strong>{{ link.value }}</strong>
                </a>
            }
        </div>
    </div>
</section>
