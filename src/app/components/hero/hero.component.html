<section class="hero container" appRevealOnScroll>
    <div class="hero__content">
        <h1>
            Подготовка к ЕГЭ<br />
            по <span>математике</span><br />
            и <span>информатике</span>
        </h1>
        <p>
            Системная подготовка с понятной теорией, практикой и поддержкой на
            каждом этапе пути к высоким баллам.
        </p>
        <div class="hero__actions">
            <a
                class="button button--primary"
                href="https://t.me/AlinaAkishina"
                target="_blank"
                rel="noopener noreferrer"
            >
                Написать в Telegram
                <app-icon name="send" />
            </a>
            <a class="button button--ghost" href="#about">
                Подробнее обо мне
                <app-icon name="chevron-down" />
            </a>
        </div>
        <ul class="hero__metrics">
            @for (item of metrics(); track item.id) {
                <li>
                    <span class="hero__metric-icon">
                        <app-icon [name]="item.icon" />
                    </span>
                    <div>
                        <strong>{{ item.title }}</strong>
                        <span>{{ item.subtitle }}</span>
                    </div>
                </li>
            }
        </ul>
    </div>

    <div class="hero__visual">
        <div class="hero__photo-stage">
            <img
                class="hero__brain"
                src="assets/images/brain-logo.png"
                alt=""
                aria-hidden="true"
            />
            <div class="hero__blur" aria-hidden="true"></div>
            <img
                class="hero__photo"
                src="assets/images/alina-hero.png"
                alt="Алина с iPad"
                loading="eager"
                decoding="async"
            />
        </div>
    </div>
</section>
