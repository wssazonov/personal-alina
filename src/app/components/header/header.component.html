<header class="header container" appRevealOnScroll>
    <div class="header__subjects">
        <span class="header__subject">математика</span>
        <span class="header__subject header__subject--active">информатика</span>
    </div>
    <a
        class="header__handle"
        href="https://t.me/alinamath_info"
        target="_blank"
        rel="noopener noreferrer"
    >
        @alinamath_info
    </a>
    <a
        class="button button--primary header__button"
        [href]="telegramUrl"
        target="_blank"
        rel="noopener noreferrer"
    >
        <app-icon name="send" />
        Написать в Telegram
    </a>
</header>
