<section class="reviews container" appRevealOnScroll>
    <div class="reviews__head">
        <h2 class="section-title">Отзывы учеников</h2>
        @if (reviews().length > 1) {
            <div class="reviews__controls">
                <button
                    class="reviews__arrow"
                    type="button"
                    (click)="previous()"
                >
                    ←
                </button>
                <button class="reviews__arrow" type="button" (click)="next()">
                    →
                </button>
            </div>
        }
    </div>

    <div class="reviews__viewport" aria-live="polite">
        <div class="reviews__track" [style.transform]="sliderTransform()">
            @for (review of reviews(); track review.id) {
                <article class="reviews__item card">
                    <p>“{{ review.text }}”</p>
                    <div class="reviews__author">
                        <strong>{{ review.author }}</strong>
                        <span>{{ review.grade }}</span>
                    </div>
                </article>
            }
        </div>
    </div>

    @if (reviews().length > 1) {
        <div class="reviews__dots">
            @for (review of reviews(); track review.id; let index = $index) {
                <button
                    type="button"
                    [class.is-active]="index === activeIndex()"
                    (click)="goTo(index)"
                    [attr.aria-label]="'Перейти к отзыву ' + (index + 1)"
                ></button>
            }
        </div>
    }
</section>
