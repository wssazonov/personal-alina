<section class="reviews container" appRevealOnScroll>
    <h2 class="section-title">Отзывы учеников</h2>

    <div class="reviews__grid">
        @for (review of reviews(); track review.id) {
            <article class="reviews__item card card--hoverable">
                <p>“{{ review.text }}”</p>
                <div class="reviews__author">
                    <div>
                        <strong>— {{ review.author }}, {{ review.grade }}</strong>
                    </div>
                    <span class="reviews__avatar">{{ getInitial(review.author) }}</span>
                </div>
            </article>
        }
    </div>

    <div class="reviews__dots">
        @for (dot of [0, 1, 2]; track dot) {
            <button
                type="button"
                [class.is-active]="dot === activeIndex()"
                (click)="goTo(dot)"
                [attr.aria-label]="'Перейти к слайду ' + (dot + 1)"
            ></button>
        }
    </div>
</section>
